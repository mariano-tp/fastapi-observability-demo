name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests with report + coverage
        run: |
          pytest -q \
            --disable-warnings \
            --maxfail=1 \
            --html=pytest-report.html \
            --self-contained-html \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.html
          if-no-files-found: error

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## FastAPI Observability Demo - CI evidence"
            echo ""
            echo "- Pytest: ran inside GitHub Actions"
            echo "- Artifacts: pytest-report (HTML), coverage (XML)"
            echo ""
            echo "Open the run logs for details, then download artifacts from the run page."
          } >> "$GITHUB_STEP_SUMMARY"
